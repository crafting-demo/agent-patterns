# Compiled from the Crafting Agent Hub — sandbox template hub-qa-engineer. Do not edit this copy.
# Package: agents/qa-engineer
# Source:  https://github.com/crafting-demo/agent-hub/tree/b9ba5702/agents/qa-engineer
# Commit:  b9ba5702addf7bc6277d1d0575e6cbafa73202e7 (2026-09-10)
# Rebuild: python3 scripts/build.py qa-engineer   (see HUB.md)
# Create this as template `hub-qa-engineer`; the agent references it by that name.

workspaces:
- name: agent
  system:
    files:
    - path: ~/.agents/skills/local-qa/SKILL.md
      mode: '0644'
      content: |
        ---
        name: local-qa
        description: Verify a change against locally running sandbox services. Use Playwright for web UI flows. Report pass or fail. Do not patch.
        ---

        # Local QA

        1. Join the existing sandbox. Do not create a new one.
        2. `cs ps`; `cs up` / `cs down` for template daemons only.
        3. Drive the user flow. Web UI: Playwright. API: real HTTP against local
           ports or sandbox endpoints.
        4. Assert at each visible step.
        5. Report pass/fail, commands, observations, concrete failures.

        No product edits. No PR.
    - path: ~/.agents/skills/cluster-verify/SKILL.md
      mode: '0644'
      content: |
        ---
        name: cluster-verify
        description: Verify a sandbox change against a real cluster using Crafting Kubernetes interception. Use after local QA passes and the template has an intercept plan. Report pass, fail, or skipped. Do not patch.
        ---

        # Cluster verify

        1. No intercept plan in the request or template? Report skipped and stop.
           Do not invent one.
        2. Join the existing sandbox. `cs ps`; `cs up` for template daemons.
        3. `cs k8s intercept start --plan PLAN --ingress-disable-auth`, then
           `cs k8s intercept status`.
        4. Drive the same flow local QA drove, through the intercepted path
           (sandbox ingress or endpoint), not local ports.
        5. Report pass/fail/skipped, plan and status, endpoint hit, observations
           per asserted step, and concrete failures.

        No product edits. No PR. Leave the sandbox running unless asked.
