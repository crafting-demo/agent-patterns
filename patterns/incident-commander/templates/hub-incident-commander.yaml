# Compiled from the Crafting Agent Hub — sandbox template hub-incident-commander. Do not edit this copy.
# Package: agents/incident-commander
# Source:  https://github.com/crafting-demo/agent-hub/tree/b9ba5702/agents/incident-commander
# Commit:  b9ba5702addf7bc6277d1d0575e6cbafa73202e7 (2026-09-10)
# Rebuild: python3 scripts/build.py incident-commander   (see HUB.md)
# Create this as template `hub-incident-commander`; the agent references it by that name.

workspaces:
- name: agent
  system:
    files:
    - path: ~/.agents/skills/diagnose-incident/SKILL.md
      mode: '0644'
      content: |
        ---
        name: diagnose-incident
        description: Reproduce a symptom in a sandbox and optionally compare via Kubernetes intercept. Report diagnosis. Do not patch.
        ---

        # Diagnose an incident

        1. Restate the symptom. Name the template.
        2. Reproduce locally (`cs up` / `cs ps`, named flow, evidence).
        3. Intercept only if a plan exists.
        4. Write diagnosis: reproduced?, where?, ruled out, sandbox, next step.
        5. No product edits. No implementer spawn.
