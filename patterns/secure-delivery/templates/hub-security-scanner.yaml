# Compiled from the Crafting Agent Hub — sandbox template hub-security-scanner. Do not edit this copy.
# Package: agents/security-scanner
# Source:  https://github.com/crafting-demo/agent-hub/tree/0df41e33/agents/security-scanner
# Commit:  0df41e33bda4f4fbd5c3fdea8e41a6dd03d87663 (2026-09-10)
# Rebuild: python3 scripts/build.py security-scanner   (see HUB.md)
# Create this as template `hub-security-scanner`; the agent references it by that name.

workspaces:
- name: scan
  checkouts:
  - path: scan
    manifest:
      overlays:
      - inline:
          hooks:
            post-checkout:
              cmd: |
                [[ -x ./lonkero ]] || {
                  curl -sSfL https://github.com/bountyyfi/lonkero/releases/download/v3.7.3/lonkero-linux-x64.tar.gz | tar -zx
                }
  system:
    files:
    - path: ~/.agents/skills/web-scan/SKILL.md
      mode: '0644'
      content: |
        ---
        name: web-scan
        description: Run the planted scan.sh CLI against a URL, parse JSON findings, and report them by severity. Use when asked to scan, re-scan, or verify that a vulnerability was fixed. Never write exploits.
        ---

        # Web scan

        ## Command

        ```
        /home/owner/scan/scan.sh [flags] URL
        ```

        `scan.sh` is planted by the hub exec template. It requests a sandbox endpoint
        cookie and execs lonkero.

        ## Steps

        1. Confirm the URL (and any mode flags) from the request.
        2. Run the command. Capture the full JSON.
        3. Summarize findings. Map to OWASP Top 10 / CWE labels when the mapping is
           obvious; otherwise describe the observation without stretching.
        4. On re-scan, diff against the previous finding list in this conversation.

        ## Do not

        - Write or suggest exploit payloads
        - Change application code
        - Skip the CLI and guess from the URL string
    - path: ~/scan/scan.sh
      mode: '0755'
      content: |
        #!/bin/bash
        COOKIE="$(/opt/sandboxd/sbin/wsenv token request --domain=endpoint --print=cookie)"
        exec "$HOME/scan/lonkero" scan --cookie "$COOKIE" --insecure "$@"
    - path: ~/scan/AGENTS.md
      mode: '0644'
      content: |
        Use `./scan.sh URL` to scan the specified URL and report vulnerabilities.
