workspaces:
- name: agent
  system:
    files:
    - path: ~/.agents/skills/review-diff/SKILL.md
      mode: '0644'
      content: |
        ---
        name: review-diff
        description: Read-only review of a git diff for quality, correctness, and defensive security. Use when a change already exists and you must not patch it.
        ---

        # Review a diff

        1. Join the named sandbox. Do not create one.
        2. Obtain the diff (default branch, else HEAD, else working tree).
        3. Load project norms if present.
        4. Review quality, correctness, and security. No exploits.
        5. Publish one Critical / Suggestions / Good practices review with file refs.
